apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      restartPolicy: Always
      containers:
      - name: demo-webapp
        image: nivedha1806/demo-app:1.3
        ports:
        - containerPort: 3000
        env:
        - name: username
          valueFrom: 
            configMapKeyRef:
              name: demo-config
              key: username
        - name: email
          valueFrom: 
            configMapKeyRef:
              name: demo-config
              key: email
        - name: mobile
          valueFrom: 
            secretKeyRef:
              name: demo-secret
              key: mobile

---

apiVersion: v1
kind: Service
metadata:
  name: demo-service
spec:
  type: NodePort
  selector:
    app: demo-app
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30100
