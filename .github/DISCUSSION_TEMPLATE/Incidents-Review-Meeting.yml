title: "Discussion"
labels: ["Incidents Review Meeting"]
body:
  - type: markdown
    attributes:
      value: |
        ## Participants
  - type: textarea
    id: Participants
    attributes:      
      description: "List of Participants for the Review Meeting"
      label: Participants
      value: |
        Mandatory Attendees:
        1. @sais8
        2. @phillipharrison
        
        Other Possible Attendees:
        1. @abhilashnallabelli
        2. @mathivanan-nb
        3. @sujith475
        4. @AG-Vashisth
        5. @markbirbeck
        6. @h3nllp
        7. @sankarshell
        
        Note: If any of the mandatory attendees are not available, please delegate the role to someone in possible attendees.
  - type: markdown
    attributes:
      value: |        
        ## Agenda
  - type: textarea
    id: Agenda
    attributes:      
      description: "Agenda of the Meeting"
      label: Agenda
      value: |
        1. Closed BUT delayed incident closure
        2. Recurring incidents (which ideally would be classified as problems)
        3. Open incidents at the time of review, ensure the Priority of the incident is documented in the notes. If there are P1 or P2 open at the time of this meeting, they should be observed and reported on daily until closure.
        4. Impact of KPIs defined - i.e. system down time etc,
        5. Action items - what actions have been / are required to be taken - Eg: Raise a finding etc
  - type: markdown
    attributes:
      value: | 
        ## KPI
  - type: textarea
    id: KPI
    attributes:      
      description: "KPI"
      label: KPI
      value: |        
        ![image](https://user-images.githubusercontent.com/97517965/213198522-1f75bf69-3da7-4626-a412-8cce483409f7.png)
        Details of how the KPIs are calculated are in #4663, in [this comment](https://github.com/sede-x/dsx-monorepo/issues/4663#issuecomment-1344066799). Details of the SLA threshold calculations are in [this comment](https://github.com/sede-x/dsx-monorepo/issues/4663#issuecomment-1345692195). The SLO threshold calculations are described in [this comment](https://github.com/sede-x/dsx-monorepo/issues/4663#issuecomment-1345702295).
  - type: markdown
    attributes:
      value: | 
        ## Discussion
  - type: textarea
    id: Discussion
    attributes:      
      description: "Discussion regarding the Incident"
      label: Discussion
      value: |
        Please add the discussed points here.
  - type: markdown
    attributes:
      value: | 
        ## Issues
  - type: textarea
    id: Issues
    attributes:      
      description: "What are the Issues faced during the Incident?"
      label: Issues
      value: |    
        Please add the details of issues faced.
  - type: markdown
    attributes:
      value: | 
        ## Decisions
  - type: textarea
    id: Decisions
    attributes:      
      description: "What are the Decisions made?"
      label: Decisions
      value: |
        Please add the details regarding the decisions taken.
  - type: markdown
    attributes:
      value: |  
        ## Action Items
  - type: textarea
    id: ActionItems
    attributes:      
      description: "What are the Action Items?"
      label: Action Items
      value: |
        Please add the Action items
  - type: markdown
    attributes:
      value: | 
        ## Additional Notes
  - type: textarea
    id: notes
    attributes:      
      description: "Additional Notes"
      label: Additional Notes
      value: |
        Please add additional notes
  
