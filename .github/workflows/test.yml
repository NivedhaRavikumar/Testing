# This is a basic workflow to help you get started with Actions


name: 'Task: Schedule a DSX User Access Report'

on:
  push:
    branches:
      - main

jobs:
  create_issue:
    name: Create a ticket for DSX User Access Report
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue to track User Access weekly Report
        uses: actions/github-script@v5
        
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Weekly DSX User Access Report',
              body: "## Description \n\nWe have to send a report which has all the information(like instruments added, new users , limits , tradebooks etc) of PROD to the POs every week. \n\nPlease follow [Generate and Send weekly DSX All Users Access Report](https://turbo-barnacle-04dc7c1a.pages.github.io/incidents/playbooks/dsx-all-users-access-report.html) Playbook.\n\n## Ticket Checklist \n\n<details><summary>Checklist</summary>\n\n- [ ] add ticket to `DSX SRE board` \n- [ ] set the `Service Class` as `Fixed date` \n- [ ] set the `Work Item Type` as `Chore` \n- [ ] set the `Board` as `Live` \n- [ ] Milestone should be set as current week Friday date, create if not exist (eg: 2022-08-12) \n\n</details>\n\n## :white_check_mark: Tasks \n\n- [ ] run query in azure for data download 1 and copy paste details in excel\n- [ ] run query in azure for data download 2 and copy paste details in excel\n- [ ] do sanity check for atleast 3 users.\n- [ ] check all fomulas and counts.\n\n## :checkered_flag: Acceptance Criteria\n\n- Weekly DSX all User Access Report is generated and shared with POS.",                                        
            })                
      
        
