name: 'Task: Check Stuck Issues'

on: [pull_request]

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/stuck
        id: stuck
        with:
          days-before-close: -1
          days-before-stale: 3
          search: repo:users/NivedhaRavikumar is:issue project:users/NivedhaRavikumar/projects/2/views/1 state:open -label:stuck
          stale-issue-label: stuck
          stale-issue-message: 'This issue is stuck. It has not been touched for 3 days. Either update it, or move it to the backlog.'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get the count
        run: echo "The count was ${{ steps.stuck.outputs.count }}"
