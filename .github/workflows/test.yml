# This is a basic workflow to help you get started with Actions


name: 'Task: Schedule a DSX User Access Report'

on:
  push:
    branches:
      - main

jobs:
  create_issue:
    name: Create a ticket for DSX User Access Report
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue to track User Access weekly Report
        uses: actions/github-script@v5
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Weekly DSX User Access Report',
              body: 'Please follow [this playbook](https://turbo-barnacle-04dc7c1a.pages.github.io/incidents/playbooks/dsx-all-users-access-report.html).',
              labels: ['chore :broom:']                            
            })  
  check_has_command_text:
    runs-on: ubuntu-latest
    outputs:
      body_has_command_text: ${{ steps.check_body_has_command_text.outputs.body_has_command_text }}   
    steps:
      - id: check_body_has_command_text
        run: echo "::set-output name=body_has_command_text::${{ github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.body, 'Please follow [this playbook](https://turbo-barnacle-04dc7c1a.pages.github.io/incidents/playbooks/dsx-all-users-access-report.html).') }}"
  add_to_project:    
    runs-on: ubuntu-latest
    needs: check_has_command_text
    if: needs.check_has_command_text.outputs.body_has_command_text == 'true'
    steps:
      - name: "Add issue to Project board"
        uses: actions/add-to-project@RELEASE_VERSION
        with:
          project-url: https://github.com/users/NivedhaRavikumar/projects/2
          github-token: ${{ secrets.MY_PAT }}
        
