# This is a basic workflow to help you get started with Actions


name: 'Task: Schedule a DSX User Access Report'

on:
  push:
    branches:
      - main

jobs:
  create_issue:
    name: Create a ticket for DSX User Access Report
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue to track User Access weekly Report
        uses: actions/github-script@v5
        
        with:
          script: |
            const markdowntable = `
            ## Description
            
            Once a month we need to provide @petercaffall and @sreeharsha1974 with a list of NORSKE and SEEL users for the previous month.
            This is used for the Trayport license billing.
            
            ## Ticket Checklist
            
            <details>            
            <summary>Checklist</summary>
            
            - [ ] add ticket to DSX SRE board
            - [ ] set the Service Class as Fixed date
            - [ ] set the Work Item Type as Chore
            - [ ] set the Board as Live
            - [ ] Milestone should be set as last week of the month
            
            </details>
            
            ## :white_check_mark: Tasks
            
            - [ ] send a list of NORSKE and SEEL users to @petercaffall and @sreeharsha1974
            
            ## :checkered_flag: Acceptance Criteria
            
            - report should be sent to @petercaffall and @sreeharsha1974
            
              | NORSKE | SEEL |
              |---|---|
              | replace with username | replace with username |
              
            ## :notebook: Notes
            
            Required task details are specified in this [playbook](https://github.com/sede-x/dsx-monorepo/blob/16427c01a56a149e847d3dfbe81f9752f987218b/docs/incidents/playbooks/reports-norske-and-seel-active-users-month-end-report.md)
            `
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Monthly login stats report for Trayport',
              body: markdowntable
            })
